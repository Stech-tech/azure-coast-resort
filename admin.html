<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin - Messages</title>
  <style>
    body {
      font-family: Arial;
      background: #f4f4f4;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 15px;
      margin: 10px 0;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .email {
      color: gray;
      font-size: 14px;
    }

    .message {
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>📩 Admin Messages</h1>

  <div class="container" id="messages"></div>

  <script>
    function loadMessages() {
      fetch("http://localhost:5000/messages")
        .then(res => res.json())
        .then(data => {
          const container = document.getElementById("messages");
          container.innerHTML = "";

          data.forEach(msg => {
            const div = document.createElement("div");
            div.className = "card";
            
            div.innerHTML = `
  <strong>${msg.sender}</strong>
  <div class="email">${msg.email}</div>
  <div class="message">${msg.message}</div>
  <small>${msg.createdAt}</small>

  <button onclick="deleteMessage(${msg.id})" style="
    margin-top:10px;
    padding:5px 10px;
    background:red;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
  ">
    Delete
  </button>
`;
            

            container.appendChild(div);
          });
        })
        .catch(err => {
          console.log(err);
          alert("Failed to load messages ❌");
        });
    }

    loadMessages();

    function deleteMessage(id) {
  fetch(`http://localhost:5000/messages/${id}`, {
    method: "DELETE"
  })
  .then(res => res.json())
  .then(data => {
    alert("Deleted 😎");
    loadMessages(); // refresh list
  })
  .catch(err => {
    console.log(err);
    alert("Delete failed ❌");
  });
}

  </script>

</body>
</html>
